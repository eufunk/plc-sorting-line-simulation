<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Schema der Sortieranlage: Einlauf, Förderband mit fünf Prüfstationen, drei Sortierer mit Ausgängen 1 bis 3, am Bandende Ausgang 4 Ausschuss">
  <!-- Auf der Doku-Webseite bewegt docs/img/anlage_schema.js die Teile mit den Klassen s-layer, s-mv, s-sens, s-rod, s-cyl, s-cnt, s-h1, s-h2 -->
  <style>
    .s-t { fill: var(--ink, #14212E); font: 600 13px var(--f-display, Arial, sans-serif); }
    .s-m { fill: var(--muted, #64707C); font: 12px var(--f-body, Arial, sans-serif); }
    .s-cnt { fill: var(--ink, #14212E); font: 600 12px var(--f-body, Arial, sans-serif); }
    .s-belt { fill: var(--ink, #14212E); }
    .s-roll { fill: var(--surface, #FBFBF8); }
    .s-mv { stroke: var(--surface, #FBFBF8); stroke-width: 2; stroke-dasharray: 3 17; opacity: .35; }
    .s-box { fill: var(--surface, #FBFBF8); stroke: var(--line, #D8DCD4); stroke-width: 1.5; }
    .s-out { fill: var(--surface, #FBFBF8); stroke-width: 2; }
    .s-o1 { stroke: var(--k, #0B5F8A); } .s-o2 { stroke: var(--accent, #0B7372); }
    .s-o3 { stroke: var(--n, #7A3FA0); } .s-o4 { stroke: var(--signal, #A9580D); }
    .s-pkg { stroke: var(--surface, #FBFBF8); stroke-width: 1.5; }
    .s-p0 { fill: var(--surface, #FBFBF8); stroke: var(--muted, #64707C); }
    .s-p1 { fill: var(--k, #0B5F8A); } .s-p2 { fill: var(--accent, #0B7372); }
    .s-p3 { fill: var(--n, #7A3FA0); } .s-p4 { fill: var(--signal, #A9580D); }
    .s-sens { fill: var(--accent, #0B7372); transition: r .15s; }
    .s-sens.on { fill: var(--signal, #A9580D); r: 8px; }
    .s-tick { stroke: var(--accent, #0B7372); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .s-cyl, .s-rod { fill: var(--muted, #64707C); }
    .s-cyl.alarm, .s-rod.alarm { fill: #D93A3A; }
    .s-lamp { fill: var(--line, #D8DCD4); stroke: var(--muted, #64707C); stroke-width: 1; }
    .s-h1.on { fill: #2E9E4F; } .s-h2.on { fill: #D93A3A; }
    .s-arrow { stroke: var(--muted, #64707C); stroke-width: 1.5; fill: none; marker-end: url(#s-head); }
    .s-brace { stroke: var(--muted, #64707C); stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="s-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted, #64707C)"/>
    </marker>
  </defs>

  <!-- Bereiche oben -->
  <path class="s-brace" d="M100,22 v-8 h310 v8"/>
  <text class="s-m" x="255" y="10" text-anchor="middle">Prüfen – was ist das für ein Paket?</text>
  <path class="s-brace" d="M470,22 v-8 h220 v8"/>
  <text class="s-m" x="580" y="10" text-anchor="middle">Sortieren</text>

  <!-- Prüfstationen mit Sensoren -->
  <g text-anchor="middle">
    <text class="s-t" x="104" y="44">ST1</text><text class="s-m" x="104" y="60">Erkennung</text>
    <text class="s-t" x="195" y="44">ST2</text><text class="s-m" x="195" y="60">Größe</text>
    <text class="s-t" x="265" y="44">ST3</text><text class="s-m" x="265" y="60">Material</text>
    <text class="s-t" x="335" y="44">ST4</text><text class="s-m" x="335" y="60">Gewicht</text>
    <text class="s-t" x="405" y="44">ST5</text><text class="s-m" x="405" y="60">Qualität</text>
    <text class="s-t" x="475" y="44">S6</text><text class="s-m" x="475" y="60">Kontrolle</text>
  </g>
  <g>
    <line class="s-tick" x1="104" y1="76" x2="104" y2="132"/><circle class="s-sens" cx="104" cy="76" r="5"/>
    <line class="s-tick" x1="195" y1="76" x2="195" y2="132"/><circle class="s-sens" cx="195" cy="76" r="5"/>
    <line class="s-tick" x1="265" y1="76" x2="265" y2="132"/><circle class="s-sens" cx="265" cy="76" r="5"/>
    <line class="s-tick" x1="335" y1="76" x2="335" y2="132"/><circle class="s-sens" cx="335" cy="76" r="5"/>
    <line class="s-tick" x1="405" y1="76" x2="405" y2="132"/><circle class="s-sens" cx="405" cy="76" r="5"/>
    <line class="s-tick" x1="475" y1="76" x2="475" y2="132"/><circle class="s-sens" cx="475" cy="76" r="5"/>
  </g>

  <!-- Einlauf -->
  <rect class="s-box" x="6" y="128" width="72" height="44" rx="4"/>
  <text class="s-t" x="42" y="155" text-anchor="middle">Einlauf</text>
  <path class="s-arrow" d="M78,150 h10"/>

  <!-- Förderband -->
  <rect class="s-belt" x="90" y="134" width="700" height="32" rx="16"/>
  <line class="s-mv" x1="120" y1="150" x2="760" y2="150"/>
  <circle class="s-roll" cx="106" cy="150" r="8"/><circle class="s-roll" cx="774" cy="150" r="8"/>
  <text class="s-m" x="300" y="190" text-anchor="middle">Förderband · 10 m · 0,5 m/s · bis zu 5 Pakete gleichzeitig</text>

  <!-- Ausgänge 1–3 unter den Sortierern, Rand in der Farbe ihres Ziels -->
  <path class="s-arrow" d="M545,170 v36"/>
  <path class="s-arrow" d="M615,170 v36"/>
  <path class="s-arrow" d="M685,170 v36"/>
  <g text-anchor="middle">
    <rect class="s-out s-o1" x="510" y="210" width="70" height="62" rx="4"/>
    <text class="s-t" x="545" y="232">Ausgang 1</text><text class="s-m" x="545" y="250">Metall</text>
    <rect class="s-out s-o2" x="582" y="210" width="66" height="62" rx="4"/>
    <text class="s-t" x="615" y="232">Ausgang 2</text><text class="s-m" x="615" y="250">Kunststoff</text><text class="s-m" x="615" y="265">klein</text>
    <rect class="s-out s-o3" x="650" y="210" width="70" height="62" rx="4"/>
    <text class="s-t" x="685" y="232">Ausgang 3</text><text class="s-m" x="685" y="250">Kunststoff</text><text class="s-m" x="685" y="265">groß</text>
    <text class="s-cnt" x="545" y="290">0 Pakete</text>
    <text class="s-cnt" x="615" y="290">0 Pakete</text>
    <text class="s-cnt" x="685" y="290">0 Pakete</text>
  </g>

  <!-- Bandende: Ausschuss -->
  <path class="s-arrow" d="M790,150 h18"/>
  <rect class="s-out s-o4" x="810" y="122" width="104" height="56" rx="4"/>
  <text class="s-t" x="862" y="145" text-anchor="middle">Ausgang 4</text>
  <text class="s-m" x="862" y="163" text-anchor="middle">Ausschuss</text>
  <text class="s-cnt" x="862" y="196" text-anchor="middle">0 Pakete</text>

  <!-- Pakete (auf der Webseite erzeugt die Animation sie laufend neu) -->
  <g class="s-layer">
    <rect class="s-pkg s-p0 s-static" x="182" y="140" width="26" height="20" rx="2"/>
    <rect class="s-pkg s-p0 s-static" x="319" y="138" width="32" height="24" rx="2"/>
    <rect class="s-pkg s-p1 s-static" x="462" y="140" width="26" height="20" rx="2"/>
  </g>

  <!-- Sortierer Q1–Q3: Druckluftzylinder über dem Band, die Kolbenstange schiebt das Paket nach unten in die Rutsche -->
  <g text-anchor="middle">
    <text class="s-t" x="545" y="76">Q1</text>
    <rect class="s-cyl" x="531" y="84" width="28" height="30" rx="3"/><rect class="s-rod" x="541" y="114" width="8" height="16"/>
    <text class="s-t" x="615" y="76">Q2</text>
    <rect class="s-cyl" x="601" y="84" width="28" height="30" rx="3"/><rect class="s-rod" x="611" y="114" width="8" height="16"/>
    <text class="s-t" x="685" y="76">Q3</text>
    <rect class="s-cyl" x="671" y="84" width="28" height="30" rx="3"/><rect class="s-rod" x="681" y="114" width="8" height="16"/>
  </g>

  <!-- Meldeleuchten -->
  <circle class="s-lamp s-h1 on" cx="20" cy="228" r="8"/><text class="s-m" x="36" y="232">H1 Betrieb</text>
  <circle class="s-lamp s-h2" cx="20" cy="256" r="8"/><text class="s-m" x="36" y="260">H2 Störung</text>

  <!-- Legende -->
  <g>
    <circle class="s-sens" cx="16" cy="312" r="5"/><text class="s-m" x="28" y="316">Sensor</text>
    <rect class="s-cyl" x="84" y="303" width="14" height="18" rx="2"/><text class="s-m" x="106" y="316">Sortierer</text>
    <rect class="s-pkg s-p0" x="178" y="305" width="18" height="14" rx="2"/><text class="s-m" x="204" y="316">Paket, noch nicht geprüft</text>
    <text class="s-m" x="370" y="316">Ziel:</text>
    <rect class="s-pkg s-p1" x="402" y="305" width="14" height="14" rx="2"/><text class="s-m" x="422" y="316">1 Metall</text>
    <rect class="s-pkg s-p2" x="482" y="305" width="14" height="14" rx="2"/><text class="s-m" x="502" y="316">2 Kunststoff klein</text>
    <rect class="s-pkg s-p3" x="610" y="305" width="14" height="14" rx="2"/><text class="s-m" x="630" y="316">3 Kunststoff groß</text>
    <rect class="s-pkg s-p4" x="734" y="305" width="14" height="14" rx="2"/><text class="s-m" x="754" y="316">4 Ausschuss</text>
  </g>
</svg>
