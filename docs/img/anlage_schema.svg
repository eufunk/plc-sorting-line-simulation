<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Schema der Sortieranlage: Einlauf, Förderband mit fünf Prüfstationen, drei Sortierer mit Ausgängen 1 bis 3, am Bandende Ausgang 4 Ausschuss">
  <style>
    .s-t { fill: var(--ink, #14212E); font: 600 13px var(--f-display, Arial, sans-serif); }
    .s-m { fill: var(--muted, #64707C); font: 12px var(--f-body, Arial, sans-serif); }
    .s-belt { fill: var(--ink, #14212E); }
    .s-roll { fill: var(--surface, #FBFBF8); }
    .s-box { fill: var(--surface, #FBFBF8); stroke: var(--line, #D8DCD4); stroke-width: 1.5; }
    .s-out { fill: var(--accent-soft, #DCEBEA); stroke: var(--accent, #0B7372); stroke-width: 1.5; }
    .s-rej { fill: var(--signal-soft, #F6E7D6); stroke: var(--signal, #A9580D); stroke-width: 1.5; }
    .s-pkg { fill: var(--accent, #0B7372); }
    .s-sens { fill: var(--accent, #0B7372); }
    .s-tick { stroke: var(--accent, #0B7372); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .s-push { fill: var(--signal, #A9580D); }
    .s-arrow { stroke: var(--muted, #64707C); stroke-width: 1.5; fill: none; marker-end: url(#s-head); }
    .s-brace { stroke: var(--muted, #64707C); stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="s-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted, #64707C)"/>
    </marker>
  </defs>

  <!-- Bereiche oben -->
  <path class="s-brace" d="M100,22 v-8 h310 v8"/>
  <text class="s-m" x="255" y="10" text-anchor="middle">Prüfen – was ist das für ein Paket?</text>
  <path class="s-brace" d="M470,22 v-8 h220 v8"/>
  <text class="s-m" x="580" y="10" text-anchor="middle">Sortieren</text>

  <!-- Prüfstationen -->
  <g text-anchor="middle">
    <text class="s-t" x="104" y="44">ST1</text><text class="s-m" x="104" y="60">Erkennung</text>
    <text class="s-t" x="195" y="44">ST2</text><text class="s-m" x="195" y="60">Größe</text>
    <text class="s-t" x="265" y="44">ST3</text><text class="s-m" x="265" y="60">Material</text>
    <text class="s-t" x="335" y="44">ST4</text><text class="s-m" x="335" y="60">Gewicht</text>
    <text class="s-t" x="405" y="44">ST5</text><text class="s-m" x="405" y="60">Qualität</text>
    <text class="s-t" x="475" y="44">S6</text><text class="s-m" x="475" y="60">Kontrolle</text>
  </g>
  <g>
    <line class="s-tick" x1="104" y1="76" x2="104" y2="130"/><circle class="s-sens" cx="104" cy="76" r="5"/>
    <line class="s-tick" x1="195" y1="76" x2="195" y2="130"/><circle class="s-sens" cx="195" cy="76" r="5"/>
    <line class="s-tick" x1="265" y1="76" x2="265" y2="130"/><circle class="s-sens" cx="265" cy="76" r="5"/>
    <line class="s-tick" x1="335" y1="76" x2="335" y2="130"/><circle class="s-sens" cx="335" cy="76" r="5"/>
    <line class="s-tick" x1="405" y1="76" x2="405" y2="130"/><circle class="s-sens" cx="405" cy="76" r="5"/>
    <line class="s-tick" x1="475" y1="76" x2="475" y2="130"/><circle class="s-sens" cx="475" cy="76" r="5"/>
  </g>

  <!-- Sortierer: Kolben über dem Band -->
  <g text-anchor="middle">
    <rect class="s-push" x="531" y="84" width="28" height="30" rx="3"/><rect class="s-push" x="541" y="114" width="8" height="16"/>
    <text class="s-t" x="545" y="76">Q1</text>
    <rect class="s-push" x="601" y="84" width="28" height="30" rx="3"/><rect class="s-push" x="611" y="114" width="8" height="16"/>
    <text class="s-t" x="615" y="76">Q2</text>
    <rect class="s-push" x="671" y="84" width="28" height="30" rx="3"/><rect class="s-push" x="681" y="114" width="8" height="16"/>
    <text class="s-t" x="685" y="76">Q3</text>
  </g>

  <!-- Einlauf -->
  <rect class="s-box" x="6" y="128" width="72" height="44" rx="4"/>
  <text class="s-t" x="42" y="155" text-anchor="middle">Einlauf</text>
  <path class="s-arrow" d="M78,150 h10"/>

  <!-- Förderband -->
  <rect class="s-belt" x="90" y="134" width="700" height="32" rx="16"/>
  <circle class="s-roll" cx="106" cy="150" r="8"/><circle class="s-roll" cx="774" cy="150" r="8"/>
  <text class="s-m" x="300" y="190" text-anchor="middle">Förderband · 10 m · 0,5 m/s · bis zu 5 Pakete gleichzeitig</text>

  <!-- Pakete -->
  <rect class="s-pkg" x="150" y="122" width="26" height="20" rx="2"/>
  <rect class="s-pkg" x="290" y="118" width="32" height="24" rx="2"/>
  <rect class="s-pkg" x="430" y="122" width="26" height="20" rx="2"/>
  <rect class="s-pkg" x="602" y="122" width="26" height="20" rx="2"/>

  <!-- Ausgänge 1–3 unter den Sortierern -->
  <path class="s-arrow" d="M545,168 v38"/>
  <path class="s-arrow" d="M615,168 v38"/>
  <path class="s-arrow" d="M685,168 v38"/>
  <g text-anchor="middle">
    <rect class="s-out" x="510" y="210" width="70" height="62" rx="4"/>
    <text class="s-t" x="545" y="232">Ausgang 1</text><text class="s-m" x="545" y="250">Metall</text>
    <rect class="s-out" x="582" y="210" width="66" height="62" rx="4"/>
    <text class="s-t" x="615" y="232">Ausgang 2</text><text class="s-m" x="615" y="250">Kunststoff</text><text class="s-m" x="615" y="265">klein</text>
    <rect class="s-out" x="650" y="210" width="70" height="62" rx="4"/>
    <text class="s-t" x="685" y="232">Ausgang 3</text><text class="s-m" x="685" y="250">Kunststoff</text><text class="s-m" x="685" y="265">groß</text>
  </g>

  <!-- Bandende: Ausschuss -->
  <path class="s-arrow" d="M790,150 h18"/>
  <rect class="s-rej" x="810" y="122" width="104" height="56" rx="4"/>
  <text class="s-t" x="862" y="145" text-anchor="middle">Ausgang 4</text>
  <text class="s-m" x="862" y="163" text-anchor="middle">Ausschuss</text>

  <!-- Legende -->
  <g>
    <circle class="s-sens" cx="16" cy="312" r="5"/><text class="s-m" x="28" y="316">Sensor (meldet an die SPS)</text>
    <rect class="s-push" x="212" y="303" width="14" height="18" rx="2"/><text class="s-m" x="234" y="316">Sortierer (Druckluftzylinder schiebt Paket vom Band)</text>
    <rect class="s-pkg" x="590" y="305" width="18" height="14" rx="2"/><text class="s-m" x="616" y="316">Paket</text>
  </g>
</svg>
